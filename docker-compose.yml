services:
  backend:
    image: ghcr.io/smlsoft/smllinecrm-backend:latest
    ports:
      - "3102:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<dbname>
      - API_KEY=your-api-key-here
      - JWT_SECRET=your-jwt-secret-here
      - CONVERSATION_GAP_HOURS=4
      - TZ=Asia/Bangkok
      - CRON_CLOSE_CONVERSATIONS=0 22 * * *
      - CRON_DAILY_EVALUATION=0 23 * * *
      - EVALUATE_PREVIOUS_DAY=true
    restart: unless-stopped

  admin:
    image: ghcr.io/smlsoft/smllinecrm-admin:latest
    ports:
      - "3101:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3001
      - API_KEY=your-api-key-here        # ต้องตรงกับ API_KEY ของ backend
      - JWT_SECRET=your-jwt-secret-here  # ต้องตรงกับ JWT_SECRET ของ backend
    depends_on:
      - backend
    restart: unless-stopped

  # Layer 1 worker (line-kpi-mcp): every 30 minutes checks urgent rooms, closes the ones a rule
  # matches and queues the rest for the external Layer 2 AI agent. No AI, no ports.
  worker:
    image: ghcr.io/smlsoft/smllinecrm-worker:latest
    environment:
      - SMLLINECRM_API_URL=http://backend:3001
      - SMLLINECRM_API_KEY=your-api-key-here   # ต้องตรงกับ API_KEY ของ backend
      - POLL_INTERVAL_SEC=1800
      - URGENT_ONLY=true
      - ENQUEUE_LAYER2=true
      - MIN_IDLE_MINUTES=2
      - TZ=Asia/Bangkok
    depends_on:
      - backend
    restart: unless-stopped
