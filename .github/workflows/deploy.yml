name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/smlsoft/smllinecrm-backend
  ADMIN_IMAGE: ghcr.io/smlsoft/smllinecrm-admin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./line-kpi-system
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          context: ./line-kpi-admin
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            docker pull ghcr.io/smlsoft/smllinecrm-backend:latest
            docker pull ghcr.io/smlsoft/smllinecrm-admin:latest
            cd /data/smllinecrm
            docker compose up -d
            docker image prune -f
